name : Build and Push Image

inputs :
  docker_username:
    required : true
  docker_password:
    required : true
  tags:
    required: true

runs:
  using: composite
  steps:
  - name: Docker Login
    uses: docker/login-action@v4
    with: 
      username: ${{ inputs.docker_username }}
      password: ${{ inputs.docker_password }}
  - name: Docker Build and push Image
    uses: docker/build-push-action@v7
    with: 
      context: ./app
      push : true
      tags : ${{ inputs.tag }}