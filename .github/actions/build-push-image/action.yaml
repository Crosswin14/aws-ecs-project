name : Build and Push Image

inputs :
  tags:
    required: true

runs:
  using: composite
  steps:
  - name: Docker Login
    uses: docker/login-action@v6
    with: 
      username: ${{ secrets.DOCKER_USERNAME }}
      password: ${{ secrets.DOCKER_PASSWORD }}
  - name: Docker Build and push Image
    uses: docker/build-push-action@v7
    with: 
      context: ./app
      push : false
      tags : ${{ inputs.tag }}